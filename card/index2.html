<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b1410">
  <meta property="og:title" content="OPTICMALL | 손진영 대표">
  <meta property="og:description" content="위즈옵틱 · 안경사 전용 B2B 도매 플랫폼 OPTICMALL 디지털 명함입니다.">
  <meta property="og:image" content="https://opticmall.co.kr/card/card-bg.jpg">
  <meta property="og:url" content="https://opticmall.co.kr/card/">
  <meta property="og:type" content="profile">
  <title>OPTICMALL | OPTICIAN'S PARTNER</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    :root {
      --gold: #d7bd83;
      --gold-light: #f1dfae;
      --bg: #1b1410;
      --ink: #f8f5ef;
      --muted: #c9c0b2;
      --line: rgba(224, 204, 160, .28);
      --panel: rgba(25, 19, 15, .88);
      --title-size: min(5.4vw, 1.7rem);
      --section-gap: 2.4rem;
      --content-width: 480px;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Pretendard, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .page {
      width: 100%;
      max-width: var(--content-width);
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--bg);
      box-shadow: 0 0 50px rgba(0,0,0,.24);
    }

    /* 첫 화면 배경 및 상단 소개 */
    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      --H: max(100svh, 800px, min(190vw, 920px));
      height: calc(var(--H) * .655 + 86px);
      padding: 34px 25px 16px;
      overflow: hidden;
      background: #120d0a;
    }

    /* 배경 사진 + 벽면 OPTICMALL 글씨 (같은 크기로 함께 움직임) */
    .stage {
      position: absolute;
      top: 0;
      right: 0;
      height: var(--H);
      aspect-ratio: 2 / 3;
      z-index: 0;
    }
    .stage img, .stage svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .stage-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(13,10,8,.55) 0%, rgba(13,10,8,.28) 30%, rgba(13,10,8,0) 46%, rgba(13,10,8,0) 58%, rgba(13,10,8,.85) 74%, rgba(13,10,8,.96) 100%);
    }
    .hero-shade {
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 62%;
      z-index: 0;
      background: linear-gradient(90deg, rgba(13,10,8,.78) 0%, rgba(13,10,8,.55) 42%, rgba(13,10,8,.12) 66%, rgba(13,10,8,0) 80%);
      -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 100%);
      mask-image: linear-gradient(180deg, #000 55%, transparent 100%);
      pointer-events: none;
    }
    .hero::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      top: calc(var(--H) * .55);
      z-index: 0;
      background: linear-gradient(180deg, rgba(18,13,10,0) 0, rgba(18,13,10,.78) calc(var(--H) * .035), #120d0a calc(var(--H) * .08), #120d0a 100%);
      pointer-events: none;
    }
    .hero > :not(.stage):not(.hero-shade) { position: relative; z-index: 1; }

    /* 큰 문구 */
    .hero-copy { margin-top: calc(var(--H) * .05 - 6px); }
    .hero-title {
      margin: 0;
      color: #fff;
      font-size: var(--title-size);
      font-weight: 350;
      letter-spacing: -.06em;
      line-height: 1.36;
      word-break: keep-all;
    }
    .hero-title .line { display: block; white-space: nowrap; }
    .hero-title .gold-num {
      font-size: 1.55em;
      font-weight: 750;
      letter-spacing: -.07em;
      line-height: 1;
      background: linear-gradient(100deg, #f6e8bd 5%, #c9a45d 52%, #f1d99c 92%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 이름 */
    .representative {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-top: 18px;
      color: #e8d5a9;
      font-size: .88rem;
      letter-spacing: .08em;
    }
    .representative strong {
      color: #fff;
      font-size: 1.3rem;
      font-weight: 650;
      letter-spacing: .02em;
    }

    /* 버튼 */
    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: auto;
      padding-top: 0;
    }
    .action {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 6px;
      border: 1px solid #736A59;
      border-radius: 999px;
      color: #EDDFB2;
      background: #1D1512;
      font-size: .94rem;
      font-weight: 700;
      letter-spacing: -.02em;
      transition: transform .2s ease;
    }
    .action:active { transform: scale(.98); }
    .action svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .action svg.fill { fill: currentColor; stroke: none; }
    .action.kakao {
      color: #241d0b;
      background: #FAE74D;
      border-color: #FAE74D;
    }
    .action.channel {
      color: #FAE74D;
      border-color: #92844A;
    }
    .action.shop {
      grid-column: 1 / -1;
      min-height: 40px;
      margin-top: 2px;
      padding: 6px 8px;
      border: 0;
      border-radius: 0;
      background: none;
      color: #E8CF8E;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .action.shop span {
      padding-bottom: 3px;
      border-bottom: 1px solid rgba(232,207,142,.5);
      color: transparent;
      background: linear-gradient(100deg, #C9A45D 0%, #E8CF8E 38%, #FFFFFF 50%, #E8CF8E 62%, #C9A45D 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shopShine 2.8s ease-in-out infinite;
    }
    @keyframes shopShine {
      0% { background-position: 120% 0; }
      60%, 100% { background-position: -20% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .action.shop span { animation: none; color: #E8CF8E; background: none; }
    }

    /* 취급 브랜드 */
    .brands-wrap {
      margin: -34px -25px 14px;
      padding: 34px 25px 26px;
      background: linear-gradient(180deg, rgba(24,17,12,.5) 0%, rgba(24,17,12,.34) 100%);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 72%, transparent 100%);
      mask-image: linear-gradient(180deg, #000 0%, #000 72%, transparent 100%);
    }
    .brands-label {
      margin: 0 0 10px;
      color: #E2C27A;
      font-size: .62rem;
      font-weight: 600;
      letter-spacing: .32em;
      text-align: center;
    }
    .brands {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: 100%;
      margin: 0;
      padding: 0;
    }
    .brand-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 6px;
    }
    .brand-cell + .brand-cell { border-left: 1px solid rgba(226,194,122,.45); }
    .brand-logo { display: block; height: auto; max-width: 100%; }
    .brand-logo.essential { width: 94px; }
    .brand-logo.suofeia { width: 70px; }
    .brand-logo.vkool { width: 88px; }
    .brand-sep { display: none; }

    /* 하단 연락처 */
    .contact {
      padding: 12px 25px 27px;
      background: #120d0a;
    }
    .contact-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
    }
    .contact-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 0;
      border-bottom: 1px solid var(--line);
      font-size: .84rem;
      line-height: 1.55;
    }
    .contact-label {
      flex: 0 0 76px;
      color: #a99e8e;
    }
    .contact-value {
      color: #f2eee7;
      text-align: right;
      overflow-wrap: anywhere;
    }
    .contact-value.address { white-space: nowrap; font-size: clamp(.74rem, 3.6vw, .94rem); letter-spacing: -.02em; }
    .footer-brand {
      margin: 34px 0 0;
      color: #d7bd83;
      font-size: .72rem;
      font-weight: 550;
      letter-spacing: .19em;
      text-align: center;
    }
    .footer-copy {
      margin: 12px 0 0;
      color: #e9e1d5;
      font-size: .88rem;
      font-weight: 400;
      letter-spacing: -.02em;
      text-align: center;
    }

    @media (max-width: 360px) {
      .hero { padding-right: 19px; padding-left: 19px; }
      .action { font-size: .9rem; gap: 6px; }
      .contact, .brands { padding-right: 19px; padding-left: 19px; }
    }
  </style>
</head>
