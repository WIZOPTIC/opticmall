<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>OPTICMALL | 손진영</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Fraunces:ital,opsz,wght@1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --navy:#0B1F3A;
    --navy-deep:#081627;
    --gold:#C5A059;
    --gold-soft:#E4CFA0;
    --cream:#F7F3EA;
    --line:rgba(197,160,89,0.30);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Pretendard', -apple-system, sans-serif; background:var(--navy-deep); }
  .page{
    max-width:420px;
    margin:0 auto;
    min-height:100vh;
    background:linear-gradient(135deg, #17436A 0%, #123457 45%, #0B1F3A 100%);
    color:var(--cream);
    padding:32px 22px 40px;
  }

  .wordmark{
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.3px;
    line-height:normal;
    text-align:right;
    background:linear-gradient(100deg,
      #7A5C30 0%, #C79A4E 22%, #F6E3B4 42%,
      #C79A4E 62%, #8A6A38 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .name{
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    font-size:30px;
    letter-spacing:0;
    margin-top:26px;
  }
  .title{
    margin-top:6px;
    font-size:14px;
    color:#A9B2C2;
  }

  /* ---------- Photo + contact row ---------- */
  .top-row{
    display:flex;
    gap:10px;
    margin-top:20px;
    align-items:flex-start;
  }
  .photo-box{
    width:118px; height:160px; flex-shrink:0;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
    background:linear-gradient(150deg,#1a3a68,#0B1F3A);
    display:flex; align-items:center; justify-content:center;
  }
  .photo-box svg{ width:44%; height:44%; stroke:var(--gold-soft); }

  .info-box{
    flex:1;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 4px;
    display:grid;
    grid-template-columns:1fr 1fr;
  }
  .info-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    text-decoration:none;
    color:var(--cream);
    padding:7px 4px;
    text-align:center;
  }
  .info-item svg{ width:16px; height:16px; stroke:var(--gold-soft); flex-shrink:0; }
  .info-item .txt{ line-height:1.25; }
  .info-item .val{ font-size:11px; font-weight:600; display:block; }
  .info-item .lbl{ font-size:9.5px; color:#8C97AB; display:block; }

  /* ---------- Section label ---------- */
  .section-label{
    margin-top:24px;
    margin-bottom:10px;
    font-size:12px;
    color:#8C97AB;
    letter-spacing:0.4px;
  }

  /* ---------- Product cards ---------- */
  .product-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .product-card{
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .product-photo{
    aspect-ratio:4/3;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .product-photo svg{ width:40%; height:40%; stroke:var(--navy); }
  .product-caption{
    padding:8px 10px;
    font-size:11.5px;
    color:#C9D1DD;
  }

  /* ---------- Quote box ---------- */
  .quote-box{
    margin-top:22px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 16px;
    text-align:center;
  }
  .quote-box p{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:14px;
    line-height:1.65;
    color:#D8DEE8;
  }

  /* ---------- CTA buttons ---------- */
  .cta{ display:flex; gap:10px; margin-top:22px; }
  .cta a{
    flex:1;
    text-align:center;
    padding:14px 6px;
    border-radius:9px;
    border:1px solid var(--gold);
    color:var(--gold-soft);
    text-decoration:none;
    font-size:13px;
    font-weight:600;
  }
  .cta a.solid{ background:var(--gold); color:var(--navy-deep); }

  .save-link{
    display:block; text-align:center; margin-top:16px;
    font-size:11.5px; color:#8894A6; text-decoration:underline; text-underline-offset:3px;
  }

  footer{ margin-top:28px; text-align:center; font-size:10px; color:#5E6980; line-height:1.8; }
</style>
</head>
