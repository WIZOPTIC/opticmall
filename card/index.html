<meta property="og:description" content="위즈옵틱 · 안경사 전용 B2B 도매 플랫폼 OPTICMALL 디지털 명함입니다.">

<style>
  :root{ --bg:#2A2420; --gold:#C8AA68; --gold-soft:#E6D3A0; --cream:#F7F4EE; --mute:#9a9183; }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#1c1815}
  body{font-family:'Pretendard',-apple-system,'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;color:var(--cream)}
  a{text-decoration:none;color:inherit}
  img{-webkit-user-drag:none;user-select:none}
  .page{max-width:420px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:36px}

  /* 대표 이미지 */
  .hero{position:relative;height:440px;overflow:hidden}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:56% 50%;display:block}
  .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,36,32,0) 72%,rgba(42,36,32,.75) 90%,var(--bg) 100%)}

  /* 이름 영역 */
  .id{position:relative;z-index:2;margin-top:-30px;text-align:center;padding:0 24px}
  .role{font-size:13px;letter-spacing:.22em;color:var(--gold)}
  .name{font-size:36px;font-weight:700;margin:10px 0 0;letter-spacing:.14em}
  .line{width:36px;height:1px;background:var(--gold);margin:18px auto}
  .tag{font-size:13.5px;line-height:1.75;color:#e6dfd2;font-weight:300}

  /* 버튼 */
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 24px 0}
  .b{height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;border:1px solid #A98C52;color:var(--gold-soft)}
  .b.y{background:#FEE500;border-color:#FEE500;color:#2A2420}
  .b.k{border-color:rgba(254,229,0,.5);color:#FEE500}
  .b svg{width:16px;height:16px;flex-shrink:0}

  /* 연락처 */
  .list{margin:30px 24px 0;border-top:1px solid rgba(200,170,104,.35)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid rgba(200,170,104,.18);font-size:13.5px}
  .row .k{color:var(--mute);flex:0 0 64px}
  .row .v{font-weight:500;text-align:right}

  /* 브랜드 */
  .sec{margin:34px 24px 0}
  .sec h4{font-size:11px;letter-spacing:.3em;color:var(--gold);font-weight:500;margin-bottom:14px}
  .br{display:flex;align-items:center;justify-content:center;gap:0}
  .br span{flex:1;text-align:center;padding:10px 0}
  .br span+span{border-left:1px solid rgba(200,170,104,.3)}
  .br .es{font-size:17px;font-weight:600;letter-spacing:.34em;margin-right:-.34em;color:var(--gold-soft)}
  .br .su{font-family:'Cormorant Garamond','Times New Roman','Noto Serif KR',Georgia,serif;font-size:23px;font-weight:500;letter-spacing:.2em;margin-right:-.2em;color:var(--cream)}

  .q{margin:34px 24px 0;font-size:12.5px;line-height:1.8;color:#b9b0a1;text-align:center;font-weight:300}
  .ft{margin:26px 0 0;text-align:center;font-size:10.5px;color:#7d7468;letter-spacing:.12em;line-height:1.9}
</style>
</head>
