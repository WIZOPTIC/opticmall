  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#1c1815}
  body{font-family:'Pretendard',-apple-system,'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;color:var(--cream)}
  a{text-decoration:none;color:inherit}
  img{-webkit-user-drag:none;user-select:none}
  .page{position:relative;max-width:480px;margin:0 auto;background:var(--bg);padding-bottom:36px;overflow:hidden;isolation:isolate}
  .page:before{content:"";position:absolute;inset:-40px;z-index:-2;background:var(--himg) center/cover no-repeat;filter:blur(16px) brightness(.5) saturate(1.05);transform:scale(1.1)}
  .page:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(42,36,32,0) 0%,rgba(42,36,32,.4) 55%,rgba(42,36,32,.65) 100%)}

  /* 첫 화면: 이미지 위에 글씨 */
  .hero{position:relative;height:100vh;height:100svh;height:max(100svh,calc(min(100vw,480px)*.966 + var(--need,392px)));max-height:calc(min(100vw,480px)*1.947 + 116px);background:#1b1410}
  .hero-img{position:absolute;left:0;right:0;top:0;bottom:var(--bb,116px);background:var(--himg) center bottom calc(min(100vw,480px)*-.51)/100% auto no-repeat;-webkit-mask-image:linear-gradient(180deg,#000 90%,transparent 100%);mask-image:linear-gradient(180deg,#000 90%,transparent 100%)}
  .hero-img:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,14,.5) 0%,rgba(25,18,14,.25) 32%,rgba(25,18,14,0) 50%)}
  .hero-text{position:absolute;top:58px;left:28px;right:28px}
  .hd{font-size:34px;line-height:1.38;font-weight:300;letter-spacing:-.01em;text-shadow:0 2px 14px rgba(0,0,0,.35)}
  .hd b{font-weight:700;color:var(--gold-soft)}
  .sg{margin-top:22px;padding-top:16px;border-top:1px solid rgba(230,211,160,.5);display:flex;align-items:baseline;gap:12px}
  .sg span{font-size:13px;letter-spacing:.2em;color:var(--gold-soft)}
  .sg strong{font-size:22px;letter-spacing:.14em;font-weight:700}
  .btns{position:absolute;left:20px;right:20px;bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .b{height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:600;background:rgba(30,22,17,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(230,211,160,.45);color:#F1DFA8}
  .b.y{background:#FEE500;border-color:#FEE500;color:#2A2420}
  .b.k{border-color:rgba(254,229,0,.55);color:#FEE500}
  .b svg{width:16px;height:16px;flex-shrink:0}

  /* 연락처 */
  .list{margin:34px 24px 0;border-top:1px solid rgba(200,170,104,.35)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid rgba(200,170,104,.2);font-size:13.5px}
  .row .k{color:var(--mute);flex:0 0 64px}
  .row .v{font-weight:500;text-align:right}

  /* 브랜드 */
  .sec{margin:34px 24px 0}
  .sec h4{font-size:11px;letter-spacing:.3em;color:var(--gold);font-weight:500;margin-bottom:14px}
  .br{display:flex;align-items:center;justify-content:center}
  .br span{flex:1;text-align:center;padding:10px 0}
  .br span+span{border-left:1px solid rgba(200,170,104,.3)}
  .br .es{font-size:17px;font-weight:600;letter-spacing:.34em;margin-right:-.34em;color:var(--gold-soft)}
  .br .su{font-family:'Cormorant Garamond','Times New Roman','Noto Serif KR',Georgia,serif;font-size:23px;font-weight:500;letter-spacing:.2em;margin-right:-.2em;color:var(--cream)}

  .q{margin:34px 24px 0;font-size:12.5px;line-height:1.8;color:#cfc6b6;text-align:center;font-weight:300}
  .ft{margin:26px 0 0;text-align:center;font-size:10.5px;color:#9a9183;letter-spacing:.12em;line-height:1.9}

  @media (max-height:740px){
    .hero{--need:354px;--bb:100px}
    .hero-text{top:40px}
    .sg{margin-top:18px}
    .btns{bottom:14px;gap:6px}
    .b{height:40px}
  }

  .hero-brands{position:absolute;right:20px;top:72px;z-index:2;display:flex;flex-direction:column;align-items:flex-end;gap:9px;padding-left:12px;border-left:1px solid rgba(230,211,160,.45);text-align:right}
  .hero-brands i{font-style:normal;font-size:8.5px;letter-spacing:.24em;color:var(--gold-soft);opacity:.85;margin-bottom:1px}
  .hero-brands span{font-size:10.5px;letter-spacing:.1em;font-weight:500;color:#f4ecdc;text-shadow:0 1px 8px rgba(0,0,0,.6);white-space:nowrap}
  @media (max-height:740px){.hero-brands{top:54px;gap:8px}}
  @media (max-width:380px){.hd{font-size:31px}.hero-brands{padding-left:10px}.hero-brands span{font-size:9.5px;letter-spacing:.06em}}
  .hero-brands{top:236px}
  @media (max-height:740px){.hero-brands{top:214px}}
  .br2{margin-top:6px;border-top:1px solid rgba(200,170,104,.3);padding-top:6px}
  .br2 span{font-size:12.5px;font-weight:600;letter-spacing:.2em;margin-right:-.2em;color:var(--gold-soft);white-space:nowrap;padding:10px 0}
  @media (max-width:380px){.br2 span{font-size:11px;letter-spacing:.12em}}
  .hero-brands{gap:14px}
  .hero-brands i{font-size:10px;margin-bottom:2px}
  .hero-brands span{font-size:12.5px;letter-spacing:.12em}
  @media (max-height:740px){.hero-brands{gap:11px}}
  @media (max-width:380px){.hero-brands span{font-size:11px;letter-spacing:.06em}}
  .hero-brands{gap:15px;filter:drop-shadow(0 1px 6px rgba(0,0,0,.55))}
  .hero-brands img{display:block;height:auto}
  .hero-brands .l-ess{width:98px}.hero-brands .l-suo{width:92px}.hero-brands .l-vk{width:80px}.hero-brands .l-rp{width:98px}.hero-brands .l-c7{width:100px}
  @media (max-height:740px){.hero-brands{gap:12px}}
  @media (max-width:380px){.hero-brands .l-ess{width:88px}.hero-brands .l-suo{width:82px}.hero-brands .l-vk{width:72px}.hero-brands .l-rp{width:88px}.hero-brands .l-c7{width:90px}}
  .hero-brands{align-items:center;padding-left:14px}
  .hero-brands i{margin-right:-.24em}
  .hero-brands{gap:23px}
  .hero-brands i{font-size:9px}
