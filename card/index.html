  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#1c1815}
  body{font-family:'Pretendard',-apple-system,'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;color:var(--cream)}
  a{text-decoration:none;color:inherit}
  img{-webkit-user-drag:none;user-select:none}
  .page{position:relative;max-width:480px;margin:0 auto;background:var(--bg);padding-bottom:36px;overflow:hidden;isolation:isolate}
  .page:before{content:"";position:absolute;inset:-40px;z-index:-2;background:var(--himg) center/cover no-repeat;filter:blur(16px) brightness(.6) saturate(.9);transform:scale(1.1)}

  .hero{position:relative;height:calc(min(100vw,480px)*1.482 + 235px);min-height:min(100svh,calc(min(100vw,480px)*2.45));background:#2A2420;overflow:hidden}
  .hero-img{position:absolute;left:-10px;right:-10px;top:-10px;bottom:0;background:var(--himg) center bottom/cover no-repeat;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 64px),transparent 100%);mask-image:linear-gradient(180deg,#000 calc(100% - 64px),transparent 100%)}
  .hero-img:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,14,.55) 0%,rgba(25,18,14,.28) 30%,rgba(25,18,14,0) 48%)}
  .hero-text{position:absolute;top:44px;left:28px;right:28px}
  .hd{font-size:30px;line-height:1.36;font-weight:300;letter-spacing:-.01em;text-shadow:0 2px 14px rgba(0,0,0,.35)}

  .sg{margin-top:16px;padding-top:12px;border-top:1px solid rgba(230,211,160,.5);display:flex;align-items:baseline;gap:12px}
  .sg span{font-size:13px;letter-spacing:.2em;color:var(--gold-soft)}
  .sg strong{font-size:20px;letter-spacing:.14em;font-weight:700}
  .btns{position:absolute;left:20px;right:20px;bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .b{height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:600;background:rgba(30,22,17,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(230,211,160,.45);color:#F1DFA8}

  .b.k{border-color:rgba(254,229,0,.55);color:#FEE500}

  .list{margin:34px 24px 0;border-top:1px solid rgba(200,170,104,.35)}

  .br span+span{border-left:1px solid rgba(200,170,104,.3)}
