<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPTICMALL | 신상품 서브페이지 목업</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Inter:wght@400;600;700;800&family=Fraunces:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-y: scroll; scroll-behavior: smooth; }
:root {
  --sky: #0B1F3A;
  --sky-lt: #EEF1F5;
  --sky-dk: #071429;
  --gold: #C9A227;
  --gold-soft: #E4CD84;
  --paper: #FAF8F4;
  --navy: #0B1F3A;
  --white: #FFFFFF;
  --g1: #F2F4F6;
  --g2: #E0E4E8;
  --g3: #9BA5B0;
  --g4: #5A6472;
  --black: #111318;
  --red: #FF4444;
  --stone: #7B7669;
  --line: #E7E2D8;
  --ink: #12181F;
  --ivory: #F7F4EE;
  --font-serif: 'Fraunces', serif;
  --font-body: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', sans-serif;
}
body { font-family: var(--font-body); background: var(--white); color: var(--black); }

/* ── 좌측 고정 스파인 ── */
.spine {
  position: fixed; left: 0; top: 0; bottom: 0; width: 44px;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 32px; z-index: 10; pointer-events: none;
}
.spine span {
  writing-mode: vertical-rl; font-family: var(--font-serif); font-style: italic;
  font-size: 13px; letter-spacing: 0.04em; color: var(--stone); white-space: nowrap;
}
@media (max-width: 860px) { .spine { display: none; } }

/* ── TOPBAR / HEADER (정적 목업) ── */
.topbar { background: var(--navy); padding: 9px 24px; }
.topbar-inner { max-width: 1440px; margin: 0 auto; display: flex; justify-content: flex-end; align-items: center; font-size: 12.5px; gap: 8px; }
.tb-link { color: var(--gold-soft); }
.tb-sep { opacity: 0.4; color: var(--gold-soft); }
header { background: var(--white); border-bottom: 1px solid var(--g2); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.header-main { max-width: 1440px; margin: 0 auto; padding: 34px 24px 22px; display: flex; align-items: center; gap: 44px; position: relative; }
.logo { font-family: var(--font-serif); font-style: italic; font-size: 22px; font-weight: 500; color: var(--navy); text-decoration: none; }
.gnb-inner { display: flex; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.gnb-item { padding: 8px 16px; font-size: 14px; font-weight: 500; color: var(--black); position: relative; white-space: nowrap; }
.gnb-item.active { color: var(--navy); font-weight: 700; }
.gnb-item.active::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); bottom: -2px; width: 20px; height: 2px; background: var(--gold); }
.header-right { display: flex; align-items: center; gap: 14px; margin-left: auto; color: var(--g4); }
.header-right svg { width: 19px; height: 19px; }
@media (max-width: 900px) { .gnb-inner { display: none; } }

/* ── 브레드크럼 ── */
.crumb { max-width: 1440px; margin: 0 auto; padding: 22px 24px 0; font-size: 12.5px; color: var(--g3); }
.crumb span.active { color: var(--navy); font-weight: 600; }

/* ── 옵션 라벨 디바이더 ── */
.option-label {
  max-width: 1440px; margin: 56px auto 0; padding: 0 24px;
  display: flex; align-items: center; gap: 14px;
}
.option-label .tag {
  background: var(--navy); color: var(--ivory); font-size: 12px; font-weight: 700;
  padding: 6px 14px; border-radius: 100px; white-space: nowrap;
}
.option-label .desc { font-size: 12.5px; color: var(--stone); }
.option-label .bar { flex: 1; height: 1px; background: var(--line); }

/* ── 힌지 디바이더 ── */
.hinge-divider { display: flex; align-items: center; gap: 16px; max-width: 1440px; margin: 64px auto; padding: 0 24px; }
.hinge-divider .bar { flex: 1; height: 1px; background: var(--line); }
.hinge-divider .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
.hinge-divider .mark { font-family: var(--font-serif); font-style: italic; font-size: 13px; color: var(--stone); white-space: nowrap; }

/* ── OPTION 1: 좌측 사진 + 우측 하이라이트 그리드(3x2=6) ── */
.hero-split {
  max-width: 1440px; margin: 24px auto 0; padding: 0 24px;
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; align-items: stretch;
}
.hero-split .left-photo {
  grid-column: span 3;
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 20px 50px rgba(11,31,58,0.14);
  position: relative;
  background: var(--paper);
}
.hero-split .left-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.hero-split .left-photo .tag {
  position: absolute; top: 20px; left: 20px; background: var(--navy); color: var(--ivory);
  font-size: 12px; font-weight: 700; padding: 6px 14px; z-index: 2;
}
.hero-split .right-panel { grid-column: span 2; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
.sec-head h2 { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 28px; color: var(--navy); }
.sec-head .more { font-size: 12.5px; color: var(--stone); text-decoration: none; border-bottom: 1px solid var(--gold); padding-bottom: 2px; white-space: nowrap; }

.grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
@media (max-width: 1100px) {
  .hero-split { grid-template-columns: 1fr; }
  .hero-split .left-photo { grid-column: 1 / -1; aspect-ratio: 16/9; }
  .hero-split .right-panel { grid-column: 1 / -1; }
}
@media (max-width: 640px) { .grid-3x2 { grid-template-columns: repeat(2, 1fr); } }

/* ── 우측 미니 리스트 (사진 + 정보 가로배치, 3개) ── */
.mini-list { display: flex; flex-direction: column; gap: 18px; height: 100%; justify-content: space-between; }
.mini-list-item {
  display: flex; align-items: center; gap: 18px;
  padding-bottom: 18px; border-bottom: 1px solid var(--line);
}
.mini-list-item:last-child { border-bottom: none; padding-bottom: 0; }
.mini-list-thumb {
  flex: 0 0 132px; width: 132px; height: 132px; border-radius: 10px;
  background: linear-gradient(155deg,#EFEBE2,#E4DECF);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.mini-list-thumb svg { opacity: 0.2; width: 60%; }
.mini-list-info { flex: 1 1 auto; min-width: 0; }
.mini-list-eyebrow { display: block; font-size: 11px; font-weight: 700; color: var(--gold); letter-spacing: 0.03em; margin-bottom: 4px; }
.mini-list-name { font-size: 14.5px; font-weight: 700; color: var(--navy); margin-bottom: 3px; }
.mini-list-desc { font-size: 12px; color: var(--stone); margin-bottom: 8px; line-height: 1.3; }
.mini-list-price { font-size: 14.5px; font-weight: 700; color: var(--ink); }
.mini-list-price .won { font-size: 12px; font-weight: 500; }
.mini-list-wish {
  flex: 0 0 auto; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  color: var(--stone); background: none; border: none; cursor: pointer;
}
.mini-list-wish svg { width: 17px; height: 17px; }

/* ── OPTION 2: 좌측 사진 + 우측 미니 하이라이트(6개, 전체그리드와 동일 폭) → 아래 전체 그리드(5열) ── */
.hero-split-mini .right-panel { display: flex; flex-direction: column; gap: 22px; }
.full-grid-wrap { max-width: 1440px; margin: 48px auto 0; padding: 0 24px; }
.full-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
@media (max-width: 1100px) { .full-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 860px) { .full-grid { grid-template-columns: repeat(2, 1fr); } }

/* ── 실제 옵틱몰 상품카드 (동일 컴포넌트) ── */
.product-card {
  background: var(--white); border-radius: 14px; overflow: hidden;
  border: 1px solid var(--line); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer;
}
.product-card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px rgba(11,31,58,0.12); border-color: var(--gold); }
.product-img-wrap { position: relative; background: linear-gradient(155deg,#EFEBE2,#E4DECF); aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.img-ph svg { opacity: 0.18; }
.p-badge { position: absolute; top: 10px; left: 10px; font-size: 12px; font-weight: 800; }
.p-badge.new { color: var(--navy); }
.wish-btn {
  position: absolute; top: 10px; right: 10px; width: 26px; height: 26px;
  background: rgba(255,255,255,0.85); border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.product-info { padding: 12px 14px 16px; }
.product-code { font-size: 12.5px; font-weight: 700; color: var(--navy); margin-bottom: 3px; }
.product-name { font-size: 11.5px; color: var(--stone); margin-bottom: 6px; line-height: 1.3; }
.p-colors { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.p-color-chip { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,0.15); }
.product-price { font-size: 13.5px; font-weight: 700; color: var(--ink); }
.product-price .won { font-size: 11px; font-weight: 500; }

footer { background: var(--sky-dk); color: rgba(247,244,238,0.55); text-align: center; padding: 40px 24px; font-size: 11.5px; margin-top: 80px; }
</style>
</head>
